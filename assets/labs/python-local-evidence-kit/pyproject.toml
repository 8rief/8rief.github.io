[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "local-evidence-kit"
version = "0.1.0"
description = "A small teaching project: scan local files, export manifests, expose CLI and API interfaces."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "typer>=0.12,<0.27",
  "fastapi>=0.116,<0.117",
  "httpx>=0.27,<0.29",
  "uvicorn>=0.30,<0.50",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
]

[project.scripts]
local-evidence = "local_evidence.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
