<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">CUDA 与本地小模型工程路线</title>
  <desc id="desc">从需求到原理、实验、5070验证和迁移边界的学习路线图。</desc>
  <rect width="960" height="420" fill="#f8fafc"/>
  <style>
    .box{fill:#ffffff;stroke:#334155;stroke-width:2;rx:14;ry:14}.head{font:700 22px sans-serif;fill:#0f172a}.txt{font:16px sans-serif;fill:#1e293b}.small{font:14px sans-serif;fill:#475569}.arrow{stroke:#2563eb;stroke-width:3;fill:none;marker-end:url(#m)}
  </style>
  <defs><marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/></marker></defs>
  <text x="40" y="44" class="head">CUDA 与本地小模型工程：需求驱动路线</text>
  <rect class="box" x="40" y="80" width="170" height="110"/>
  <text x="62" y="114" class="txt">真实需求</text>
  <text x="62" y="142" class="small">加速、理解瓶颈</text>
  <text x="62" y="166" class="small">微调领域模型</text>
  <rect class="box" x="260" y="80" width="170" height="110"/>
  <text x="282" y="114" class="txt">原理模型</text>
  <text x="282" y="142" class="small">并行度、访存</text>
  <text x="282" y="166" class="small">数据、loss、评估</text>
  <rect class="box" x="480" y="80" width="170" height="110"/>
  <text x="502" y="114" class="txt">最小实验</text>
  <text x="502" y="142" class="small">vector add</text>
  <text x="502" y="166" class="small">LoRA baseline</text>
  <rect class="box" x="700" y="80" width="190" height="110"/>
  <text x="722" y="114" class="txt">本地验证</text>
  <text x="722" y="142" class="small">RTX 5070 / 12GB</text>
  <text x="722" y="166" class="small">报告 gap 与边界</text>
  <path class="arrow" d="M210 135 H255"/><path class="arrow" d="M430 135 H475"/><path class="arrow" d="M650 135 H695"/>
  <rect class="box" x="90" y="245" width="220" height="95"/>
  <text x="112" y="278" class="txt">CUDA主线</text>
  <text x="112" y="306" class="small">SIMT、memory、profiling</text>
  <rect class="box" x="370" y="245" width="220" height="95"/>
  <text x="392" y="278" class="txt">小模型主线</text>
  <text x="392" y="306" class="small">baseline、LoRA、QLoRA</text>
  <rect class="box" x="650" y="245" width="220" height="95"/>
  <text x="672" y="278" class="txt">agent主线</text>
  <text x="672" y="306" class="small">RAG、工具、评估、优化</text>
  <path class="arrow" d="M480 190 C430 218 330 225 240 245"/>
  <path class="arrow" d="M565 190 V240"/>
  <path class="arrow" d="M705 190 C730 215 750 225 760 245"/>
  <text x="40" y="390" class="small">原则：5070是可复现实验平台，不是知识边界；每篇都写清需求、原理、为什么、实验、迁移边界。</text>
</svg>
